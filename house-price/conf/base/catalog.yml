# =============================================================================
# THE DATA CATALOG
# -----------------------------------------------------------------------------
# This file is Kedro's "address book" for data. Instead of writing
# pd.read_csv(...) or joblib.dump(...) inside your code, you DECLARE here where
# each dataset lives and what format it is. Your Python nodes then just refer to
# the name (e.g. "house_data") and Kedro handles loading/saving automatically.
#
# WHY this is great: to switch from a local file to Azure cloud storage later,
# you only change THIS file -- your Python code never changes. That is exactly
# what makes moving to Azure easy in the later parts.
#
# Any name used in a node but NOT listed here (like X_train) is kept in memory
# only -- Kedro calls these "MemoryDataset" and they vanish after the run.
#
# ABFS PATH FORMAT -- write it as abfs://<container>/<path>, NOT the
# abfs://<container>@<account>.dfs.core.windows.net/<path> form you see in Azure
# docs. Kedro parses filepaths with fsspec's infer_storage_options and then keeps
# only host + path (kedro/io/core.py _parse_filepath), so the "<container>@" part
# is silently DISCARDED. adlfs then reads the hostname as the container name and
# the save dies with a very misleading:
#     ContainerNotFound: The specified container does not exist
# The account name comes from `credentials: azure_blob` instead -- see
# conf/base/credentials.yml.
# =============================================================================

house_data:
  type: pandas.CSVDataset
  filepath: abfs://kedro-temp/data/01_raw/house_data.csv
  credentials: azure_blob

regressor:
  type: pickle.PickleDataset          
  filepath: abfs://kedro-temp/data/06_models/regressor.pickle
  versioned: true   
  credentials: azure_blob

metrics:
  type: json.JSONDataset
  filepath: abfs://kedro-temp/data/08_reporting/metrics.json
  credentials: azure_blob
