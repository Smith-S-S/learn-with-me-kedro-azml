# =============================================================================
# pip.conf -- tell pip to install from the COMPANY feed, not the open internet
# =============================================================================
# WHERE THIS FILE GOES
#   Linux / macOS / inside a container :  ~/.pip/pip.conf   or  /etc/pip.conf
#   Windows                            :  %APPDATA%\pip\pip.ini   (same content,
#                                          the file is just named .ini there)
#
# WHAT IT DOES
#   By default `pip install pandas` goes to pypi.org, the public internet.
#   This file redirects every install to your organization's private feed.
#
# =============================================================================
# THE MOST IMPORTANT LINE IN THIS FILE IS THE ONE THAT IS *NOT* HERE
# -----------------------------------------------------------------------------
# You will see `extra-index-url` in many tutorials. DO NOT USE IT for a private
# feed. Here is exactly why, because it is a real and famous attack:
#
#   `extra-index-url` means "check the private feed AND ALSO check public PyPI,
#    then take the HIGHEST VERSION NUMBER found in either."
#
#   Say your company has an internal package called `houseprice-utils` at
#   version 1.2.0, living only in your private feed.
#
#   An attacker guesses that name (they read it in a job advert, a public
#   Dockerfile, or a GitHub issue). They upload their OWN `houseprice-utils`
#   to public PyPI at version 99.0.0, containing whatever code they like.
#
#   Your build runs. pip checks both places, sees 99.0.0 > 1.2.0, and installs
#   THE ATTACKER'S PACKAGE. Nobody typed anything wrong. Nothing looks broken.
#
#   This is called DEPENDENCY CONFUSION, and it has been used successfully
#   against very large companies.
#
# THE FIX (what this file does):
#   Use `index-url` ONLY -- a single source of truth. Your Azure Artifacts feed
#   is configured with an "upstream source" to public PyPI, so public packages
#   still work: the FEED fetches them, caches them, and serves them to you.
#   Because the feed answers every request, an internal name can never be
#   silently overridden by a public one.
# =============================================================================

[global]

# The ONE place pip is allowed to install from.
# Replace: myorg = your Azure DevOps organization
#          my-python-feed = your feed name
index-url = https://pkgs.dev.azure.com/myorg/_packaging/my-python-feed/pypi/simple/

# NOTE: there is deliberately NO extra-index-url line here. See above.

# How long to wait before giving up on the feed (seconds).
timeout = 60

# Retry a couple of times -- corporate networks have brief hiccups and a single
# blip should not fail an entire build.
retries = 3

# Refuse plain-HTTP hosts. Everything must be HTTPS.
# (If your org runs an internal mirror on http, it would be listed under
#  trusted-host -- but prefer fixing the TLS instead.)
# trusted-host =
